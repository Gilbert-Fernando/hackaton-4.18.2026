<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASL Realtime</title>
    <style>
      body { margin: 0; background: #0b1020; color: #e5e7eb; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; }
      .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
      .row { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; align-items: start; }
      .card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 12px; }
      img { width: 100%; border-radius: 12px; background: #000; }
      pre { white-space: pre-wrap; word-break: break-word; margin: 0; font-size: 12px; line-height: 1.35; }
      .muted { color: #a3a3a3; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h2 style="margin: 0 0 6px 0;">ASL Realtime</h2>
      <div class="muted">Shows the same live prediction payload as `main.py` (backend from `src/predict_realtime.py`).</div>

      <div class="row" style="margin-top: 14px;">
        <div class="card">
          <img src="/video" alt="video" />
        </div>
        <div class="card">
          <div style="font-weight: 600; margin-bottom: 8px;">/state</div>
          <pre id="state">Loading…</pre>
        </div>
      </div>

      <div class="muted" style="margin-top: 12px;">If video is black, the webcam is in use by another app or the wrong camera index is selected.</div>
    </div>

    <script>
      const el = document.getElementById('state');
      async function refresh() {
        try {
          const res = await fetch('/state', { cache: 'no-store' });
          const json = await res.json();
          el.textContent = JSON.stringify(json, null, 2);
        } catch (e) {
          el.textContent = String(e);
        }
      }
      setInterval(refresh, 150);
      refresh();
    </script>
  </body>
</html>
